name: Cloudflareに公開

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-cloudflare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.145.0
      PROJECT: jakureibo-sagashi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 鍵が登録されているか確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID をリポジトリのSecretsに登録してください"
            exit 1
          fi
          # 空白や改行、ダッシュボードのアドレスごと貼られた場合も、32文字のIDだけを取り出す
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          found=$(printf '%s' "$id" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          [ -n "$found" ] && id="$found"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          # トークンも同様に、空白や改行、確認用コマンドごと貼られた場合に本体だけを取り出す
          tok=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          case "$tok" in *Bearer*) tok=$(printf '%s' "$tok" | sed -E 's/.*Bearer([A-Za-z0-9_-]+).*/\1/') ;; esac
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "トークンは${#tok}文字です"
          if ! printf '%s' "$id" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID は英小文字と数字32文字です（今は${#id}文字）。余分な文字が入っていないか確認してください"
            exit 1
          fi

      - name: 公開するファイルだけを集める
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js icon.svg icon-*.png data site/

      - name: 情報受付用のデータベースを用意
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="jakureibo-feedback") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create jakureibo-feedback
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="jakureibo-feedback") | .uuid')
          fi
          echo "database id: $id"
          sed -i "s/__DATABASE_ID__/$id/" wrangler.toml
          $WRANGLER d1 execute jakureibo-feedback --remote --file=schema.sql

      - name: Cloudflare Pagesに公開
        run: |
          $WRANGLER pages project list | grep -q "$PROJECT" || $WRANGLER pages project create "$PROJECT" --production-branch main
          $WRANGLER pages deploy site --project-name "$PROJECT" --branch main | tee deploy.log
          echo "### 公開先: https://$PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
