name: 届いた情報をIssueに移す

on:
  schedule:
    - cron: "17 0 * * *"   # 毎日 9:17（日本時間）
  workflow_dispatch:

concurrency: feedback-to-issues

permissions:
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WRANGLER: npx --yes wrangler@4.145.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 鍵を整える
        run: |
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          tok=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: 新しく届いた情報をIssueにする
        run: |
          $WRANGLER d1 execute jakureibo-feedback --remote --json \
            --command "SELECT id, created, station, line, message FROM feedback WHERE exported = 0 ORDER BY id LIMIT 50" > rows.json
          jq -c '.[0].results[]' rows.json > rows.jsonl || true
          gh label create "情報提供" --color 1f7fb8 --description "アプリから届いた路線情報" 2>/dev/null || true
          ids=""
          while read -r row; do
            [ -z "$row" ] && continue
            id=$(jq -r '.id' <<< "$row")
            station=$(jq -r '.station // ""' <<< "$row")
            line=$(jq -r '.line // ""' <<< "$row")
            when=$(jq -r '.created / 1000 | strftime("%Y-%m-%d %H:%M UTC")' <<< "$row")
            {
              echo "アプリの「情報を送る」欄から届いた内容です（送った人が書いたそのままの文章です）。"
              echo
              echo "- 駅: ${station:-（未選択）}"
              echo "- 路線: ${line:-（未選択）}"
              echo "- 受付: $when（#$id）"
              echo
              echo '```text'
              jq -r '.message' <<< "$row" | sed 's/```/` ` `/g'
              echo '```'
            } > body.md
            gh issue create --title "情報提供: ${station:-駅未選択} ${line}" --body-file body.md --label "情報提供"
            ids="$ids,$id"
          done < rows.jsonl
          if [ -n "$ids" ]; then
            $WRANGLER d1 execute jakureibo-feedback --remote --command "UPDATE feedback SET exported = 1 WHERE id IN (${ids#,})"
          fi
          echo "移したもの: ${ids#,}"
